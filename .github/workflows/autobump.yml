name: AEGIS FunPay 24/7 Cloud AutoBumper & Dashboard

on:
  schedule:
    - cron: '12 1,5,9,13,17,21 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: funpay-24-7-server
  cancel-in-progress: true

jobs:
  funpay-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Full 24/7 Cloud Dashboard + AutoBumper + Telegram Bot
        env:
          FUNPAY_GOLDEN_KEY: ${{ secrets.FUNPAY_GOLDEN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git pull origin main --rebase || true
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          echo "Starting Full Cloud Server for 4 hours (until next cron wave)..."
          timeout 14200 python server.py --no-browser || true
          git config user.name "AEGIS Cloud Bot"
          git config user.email "aegis222@users.noreply.github.com"
          git add app_data.json
          git diff --staged --quiet || git commit -m "Sync FunPay orders & state [skip ci]" && git push || true
