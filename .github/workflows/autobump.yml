name: AEGIS FunPay 24/7 Cloud AutoBumper & Dashboard

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: funpay-24-7-server
  cancel-in-progress: true

jobs:
  funpay-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Full 24/7 Cloud Dashboard + AutoBumper + Telegram Bot
        env:
          FUNPAY_GOLDEN_KEY: ${{ secrets.FUNPAY_GOLDEN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DISPATCH_TOKEN: ${{ secrets.AUTO_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull origin main --rebase || true
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          echo "Starting Full Cloud Server with 24/7 infinite relay protection..."
          timeout 19800 python server.py --no-browser || true
          git config user.name "AEGIS Cloud Bot"
          git config user.email "aegis222@users.noreply.github.com"
          git add app_data.json
          git diff --staged --quiet || git commit -m "Sync FunPay orders & state [skip ci]" && git push || true
